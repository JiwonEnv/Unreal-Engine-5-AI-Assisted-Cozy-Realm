; 그래픽 품질 단계별 추가 설정 (설정 창 > 화면 > 그래픽 품질 · 엔진 BaseScalability.ini 위에 덧씌움 · 출시 수정 2차 2026-10-30)
; 🤖 하드웨어 레이트레이싱(Lumen)은 끄지 않고 품질 '낮음(0)·중간(1)'에서만 끔 → 그 단계는 소프트웨어 레이트레이싱/기본 조명 · '높음(2)·최고(3)'은 켬
; 프로젝트 지원(r.RayTracing=True)은 그대로라 품질을 다시 올리면 바로 켜짐

[GlobalIlluminationQuality@0]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@1]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@2]
r.Lumen.HardwareRayTracing=1

[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=1

[GlobalIlluminationQuality@Cine]
r.Lumen.HardwareRayTracing=1
